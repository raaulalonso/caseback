[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caseback-wellness"
version = "0.1.0"
description = "Caseback wellness algorithms: steps, sleep, skin temperature and readiness"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.26", "scipy>=1.11", "caseback-ppg"]   # caseback-ppg: tree-ensemble runtime

[project.optional-dependencies]
dev = ["pytest>=8.0", "scikit-learn>=1.4", "joblib"]
train = ["scikit-learn>=1.4", "joblib"]      # only to fit the models; inference is plain NumPy

[tool.setuptools.packages.find]
where = ["."]
include = ["caseback_wellness*"]

[tool.setuptools.package-data]
caseback_wellness = ["models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["dataset: needs a downloaded public dataset (skipped when absent)"]
