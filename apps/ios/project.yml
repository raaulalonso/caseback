name: Caseback
options:
  bundleIdPrefix: io.caseback
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  CasebackProtocol:
    path: CasebackProtocol
targets:
  Caseback:
    type: application
    platform: iOS
    sources:
      - path: Caseback
    dependencies:
      - package: CasebackProtocol
      - target: CasebackWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raaulalonso.caseback
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Caseback/Info.plist
        CODE_SIGN_ENTITLEMENTS: Caseback/Caseback.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Caseback/Info.plist
      properties:
        CFBundleDisplayName: Caseback
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - IBMPlexMono-Light.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
        NSBluetoothAlwaysUsageDescription: Caseback talks to your disc over Bluetooth. Nothing leaves your phone.
        NSHealthShareUsageDescription: Caseback can read back what it wrote to Apple Health to avoid duplicates.
        NSHealthUpdateUsageDescription: Caseback writes heart rate, HRV, steps and sleep from your disc to Apple Health.
        UIBackgroundModes:
          - bluetooth-central
        CFBundleLocalizations: [en, es]
        CFBundleURLTypes:
          - CFBundleURLName: com.raaulalonso.caseback
            CFBundleURLSchemes: [caseback]
    entitlements:
      path: Caseback/Caseback.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.com.raaulalonso.caseback
  CasebackWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CasebackWidgets
      - path: Caseback/Widgets
      - path: Caseback/Design/Tokens.swift
      - path: Caseback/Design/Typography.swift
      - path: Caseback/Design/Shared.swift
      - path: Caseback/Today/Charts.swift
      - path: Caseback/Today/TodayModel.swift
      - path: Caseback/Today/Insights.swift
      - path: Caseback/Today/Scores.swift
      - path: Caseback/Today/TodayFixtures.swift
      - path: Caseback/Resources/Localizable.xcstrings
      - path: Caseback/Resources/Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.raaulalonso.caseback.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CasebackWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: CasebackWidgets/CasebackWidgets.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        SKIP_INSTALL: YES
    info:
      path: CasebackWidgets/Info.plist
      properties:
        CFBundleDisplayName: Caseback
        CFBundleLocalizations: [en, es]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - IBMPlexMono-Light.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
    entitlements:
      path: CasebackWidgets/CasebackWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.raaulalonso.caseback
  CasebackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CasebackTests
    dependencies:
      - target: Caseback
      - package: CasebackProtocol
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.raaulalonso.caseback.tests
  CasebackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CasebackUITests
    dependencies:
      - target: Caseback
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.raaulalonso.caseback.uitests
schemes:
  Caseback:
    build:
      targets:
        Caseback: all
    test:
      targets:
        - CasebackTests
        - CasebackUITests
