# Bring-up configuration for the nRF52840 DK: serial console on, INFO readable
# before bonding. Production: west build ... -DEXTRA_CONF_FILE=prj_production.conf
# Symbol names assume Zephyr 4.x / NCS 3.x; nothing here has been built yet.

# --- Bluetooth: peripheral, one link -------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="Caseback"
# per-unit name "Caseback-XXXX" is set at runtime (bt_set_name)
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=16

# Connection parameters preferred by the peripheral, must equal
# CASEBACK_CONN_* in protocol.h (main.c has a BUILD_ASSERT): 1.25 ms units,
# 800..1200 = 1.0..1.5 s, latency 0, timeout 600 (10 ms units) = 6 s.
# The 1.5 s ceiling keeps timeout > 3 * interval_max, an iOS rule (spec/gatt.md,
# from Apple's guidelines from memory). The central (iPhone) picks the real interval.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=800
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=1200
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# ATT MTU 247 requested (CASEBACK_ATT_MTU_REQUESTED; iOS settles at 185 and frames
# are at most 182 bytes) over 251-byte LL packets.
# BT_CTLR_DATA_LENGTH_MAX is for the Zephyr LL; on the nRF SoftDevice
# Controller remove it if the symbol is undefined.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# --- Security (decision D5): LE Secure Connections, bonding, RPA ---------
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_SETTINGS=y
# iOS GATT cache (spec/gatt.md): Service Changed + database hash
CONFIG_BT_GATT_SERVICE_CHANGED=y
CONFIG_BT_GATT_CACHING=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
# Secure-Connections-only mode is deliberately not enabled: with no display or
# keyboard the pairing is Just Works, and the SC-only mode of the host stack
# may demand an authenticated (MITM) link. Check before enabling:
# CONFIG_BT_SMP_SC_PAIR_ONLY=y

# --- Bring-up switches ----------------------------------------------------
CONFIG_CASEBACK_REQUIRE_ENCRYPTION=n

# --- Peripherals -----------------------------------------------------------
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_HWINFO=y
CONFIG_WATCHDOG=y

# --- Console: the DK J-Link VCOM UART (not USB CDC) ------------------------
CONFIG_SERIAL=y
CONFIG_LOG=y
# (no CONFIG_LOG_* tuning here: production turns LOG off and dependent
# assignments would then not take effect)

# --- Power / memory --------------------------------------------------------
# Tickless idle is the nRF52 default; no CONFIG_PM (nRF52 has only idle and
# System OFF, nothing to gain yet).
CONFIG_TICKLESS_KERNEL=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
