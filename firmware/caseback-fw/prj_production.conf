# Production overlay on top of prj.conf:
#   west build -b <board> firmware/caseback-fw -- -DEXTRA_CONF_FILE=prj_production.conf

# INFO (device id) only after encryption, decision D5.
CONFIG_CASEBACK_REQUIRE_ENCRYPTION=y

# No serial, no console, no log backend: the UART would keep the SoC above
# the ~µA floor of the power model. LOG_INF() etc. compile to nothing.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# Disable assertions in the bench image.
CONFIG_ASSERT=n

CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_MAX_PAIRED=1

# Sensor FIFO and BLE frame buffers share the system workqueue.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072

# Keep malformed existing NVS media intact.
CONFIG_NVS_INIT_BAD_MEMORY_REGION=n
CONFIG_CASEBACK_FW_REV=4

# SWD boots at zero. Bound the linked image to one future OTA slot.
CONFIG_FLASH_LOAD_SIZE=0x66000

CONFIG_POWEROFF=y
